name: CI/CD

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-and-push:
    name: Build and push images
    runs-on: ubuntu-latest
    env:
      REGISTRY: ${{ secrets.DOCR_REGISTRY }}
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to DigitalOcean Container Registry
        if: env.REGISTRY != ''
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCR_USERNAME }}
          password: ${{ secrets.DOCR_TOKEN }}

      - name: Build and push API image
        run: |
          docker build -f apps/api/Dockerfile -t ${{ env.REGISTRY }}/vesioh-api:${{ env.IMAGE_TAG }} .
          docker push ${{ env.REGISTRY }}/vesioh-api:${{ env.IMAGE_TAG }}

      - name: Build and push Web image
        run: |
          docker build -f apps/web/Dockerfile -t ${{ env.REGISTRY }}/vesioh-web:${{ env.IMAGE_TAG }} apps/web
          docker push ${{ env.REGISTRY }}/vesioh-web:${{ env.IMAGE_TAG }}

  deploy-api-to-do:
    name: Deploy API to DigitalOcean
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Install doctl
        run: |
          curl -sL https://github.com/digitalocean/doctl/releases/latest/download/doctl-$(uname -s)-amd64.tar.gz | tar -xz
          sudo mv doctl /usr/local/bin/doctl

      - name: Authenticate doctl
        env:
          DO_API_TOKEN: ${{ secrets.DO_API_TOKEN }}
        run: doctl auth init -t "$DO_API_TOKEN"
      - name: Prepare and apply App spec
        env:
          DOCR_REGISTRY_FULL: ${{ secrets.DOCR_REGISTRY }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
        run: |
          if [ -z "${{ secrets.DO_APP_ID }}" ]; then
            echo "DO_APP_ID not set — skipping automatic App Platform update. Set DO_APP_ID secret to enable."
            exit 0
          fi
          DOCR_REGISTRY_FULL="${DOCR_REGISTRY_FULL}"
          DOCR_REGISTRY_HOST="${DOCR_REGISTRY_FULL%%/*}"
          DOCR_REPOSITORY="${DOCR_REGISTRY_FULL#*/}/vesioh-api"
          export DOCR_REGISTRY_HOST DOCR_REPOSITORY IMAGE_TAG
          echo "Using registry host: $DOCR_REGISTRY_HOST"
          echo "Using repository: $DOCR_REPOSITORY"
          envsubst < digitalocean/app-spec.yaml.template > /tmp/app-spec.yaml
          echo "Generated app spec:"
          cat /tmp/app-spec.yaml
          doctl apps update ${{ secrets.DO_APP_ID }} --spec /tmp/app-spec.yaml

  deploy-web-railway:
    name: Deploy Web to Railway
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Install Railway CLI
        run: curl -sSL https://raw.githubusercontent.com/railwayapp/cli/master/install.sh | sh

      - name: Login to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "${RAILWAY_TOKEN}" ]; then
            echo "RAILWAY_TOKEN not set — skipping Railway deploy."
            exit 0
          fi
          railway login --apiKey "$RAILWAY_TOKEN" || true

      - name: Deploy to Railway (non-interactive)
        run: |
          if [ -f railway.json ]; then
            echo "Found railway.json — running 'railway up --detach'"
            railway up --detach || echo "railway up failed"
          else
            echo "railway.json not found — skipping Railway deploy. Create railway.json or copy railway.json.template and add projectId/service config."
          fi
